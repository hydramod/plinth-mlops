# Wave 3: the KServe controller and the Kyverno policies both have to be up first,
# otherwise the InferenceService is either rejected or silently unmanaged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: models
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/hydramod/plinth-mlops.git
    targetRevision: main
    path: gitops/models
  destination:
    server: https://kubernetes.default.svc
    namespace: models
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
